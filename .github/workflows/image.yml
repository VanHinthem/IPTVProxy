name: Development image
on:
  push:
    branches: [main, feature/mvp-1-live-tv, feature/mvp-2-channel-management, feature/mvp-3-vod]
  workflow_dispatch:
permissions:
  contents: read
  packages: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - run: dotnet build src/IPTVProxy/IPTVProxy.csproj -c Release
      - run: dotnet run --project tests/BufferChecks/BufferChecks.csproj -c Release
      - run: dotnet run --project tests/CatalogChecks/CatalogChecks.csproj -c Release
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and publish immutable development image
        run: |
          set -eu
          image="ghcr.io/${GITHUB_REPOSITORY,,}"
          docker buildx build --platform linux/amd64 --tag "$image:sha-$(git rev-parse HEAD)" --push .
