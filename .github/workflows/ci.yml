name: CI
on:
  push:
    branches: [main]
  pull_request:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - run: dotnet build src/IPTVProxy/IPTVProxy.csproj -c Release
      - run: dotnet run --project tests/BufferChecks/BufferChecks.csproj -c Release
      - run: docker build -t iptvproxy:ci .
      - name: Container smoke test
        shell: bash
        run: |
          set -euo pipefail
          admin=$(openssl rand -hex 16)
          viewer=$(openssl rand -hex 16)
          docker run -d --name iptvproxy-ci -p 127.0.0.1:8080:8080 \
            -e Accounts__AdminPassword="$admin" -e Accounts__IptvPassword="$viewer" iptvproxy:ci
          trap 'docker rm -f iptvproxy-ci >/dev/null' EXIT
          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:8080/health >/dev/null; then break; fi
            sleep 1
          done
          curl -fsS http://127.0.0.1:8080/health
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8080/)" = 401
          page=$(curl -fsS -u "admin:$admin" http://127.0.0.1:8080/)
          grep -q IPTVProxy <<< "$page"
          script=$(printf '%s' "$page" | python3 -c 'import sys,re; m=re.search(r"""<script[^>]+src="([^"]*blazor[^"]*\.js)" """.strip(),sys.stdin.read()); assert m, "Blazor script missing"; print(m.group(1))')
          curl -fsS -u "admin:$admin" "http://127.0.0.1:8080/${script#/}" -o /tmp/blazor.js
          test -s /tmp/blazor.js
          test "$(curl -s -o /dev/null -w '%{http_code}' 'http://127.0.0.1:8080/player_api.php?username=viewer&password=wrong')" = 401
          curl -fsS --get --data-urlencode username=viewer --data-urlencode "password=$viewer" http://127.0.0.1:8080/player_api.php | jq -e '.user_info.auth == 1'
          curl -fsS --get --data-urlencode username=viewer --data-urlencode "password=$viewer" --data-urlencode action=get_live_streams http://127.0.0.1:8080/player_api.php | jq -e '. == []'
          test "$(curl -s -o /dev/null -w '%{http_code}' "http://127.0.0.1:8080/live/viewer/$viewer/1.ts")" = 404
