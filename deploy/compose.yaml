services:
  iptvproxy:
    image: ${IPTVPROXY_IMAGE:?Set IPTVPROXY_IMAGE to the tested GHCR tag}
    ports:
      - "${BIND_ADDRESS:-127.0.0.1}:${HOST_PORT:-5089}:8080"
    environment:
      Accounts__AdminName: "${ADMIN_NAME:-admin}"
      Accounts__AdminPassword: "${ADMIN_PASSWORD:?Set ADMIN_PASSWORD}"
      Accounts__IptvName: "${IPTV_NAME:-viewer}"
      Accounts__IptvPassword: "${IPTV_PASSWORD:?Set IPTV_PASSWORD}"
      PublicBaseUrl: "${PUBLIC_BASE_URL:?Set PUBLIC_BASE_URL}"
      Network__TrustedProxies: "${TRUSTED_PROXIES:-}"
      Network__LocalNetworks: "${LOCAL_NETWORKS:-127.0.0.0/8,::1/128}"
      Network__RestrictAdmin: "${RESTRICT_ADMIN:-false}"
    volumes:
      - iptvproxy-data:/data
    restart: unless-stopped
volumes:
  iptvproxy-data:
